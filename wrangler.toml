name = "ai-chat-api"
main = "src/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "ai-chat-db"
database_id = "ee6fe2cb-0284-4416-a849-3aed8ecc0717"
# Uncomment after running: wrangler d1 create ai-chat-db

# Environment variables (set via wrangler secret put OPENAI_API_KEY)
# [vars]
# OPENAI_API_KEY = ""
# GITHUB_TOKEN = ""
# GITHUB_WEBHOOK_SECRET = ""
# COHERE_API_KEY = ""
